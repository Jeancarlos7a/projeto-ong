<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/styles.css">
    <title>Cadastro - ONG Solidariedade</title>
</head>

<body>
    <header>
        <h1>ONG Solidariedade</h1>
    </header>
    <nav>
        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="menu-hamburguer">☰</label>

        <div class="menu-links">
            <a href="index.html">Início</a>

            <div class="dropdown">
                <a href="projetos.html">Projetos</a>

                <div class="submenu">
                    <a href="projetos.html">Projetos Sociais</a>
                    <a href="cadastro.html">Seja Voluntário</a>
                </div>
            </div>

            <a href="cadastro.html">Cadastro</a>
        </div>
    </nav>
    <main class="container">
        <section>
            <h2>Cadastro de Colaborador</h2>

            <form>
                <fieldset>
                    <legend>Dados do colaborador</legend>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>


                    <br><br>

                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

                    <br><br>

                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00"
                        pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" required>

                    <br><br>

                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000"
                        pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" required>

                    <br><br>

                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep" placeholder="00000-000" pattern="[0-9]{5}-[0-9]{3}" required>

                    <br><br>

                    <label for="participacao">Como deseja participar?</label>
                    <select id="participacao" name="participacao" required>
                        <option value="">Selecione</option>
                        <option value="voluntario">Voluntário</option>
                        <option value="doador">Doador</option>
                    </select>

                    <br><br>

                    <button type="submit">Enviar cadastro</button>
                </fieldset>
            </form>
        </section>
    </main>
    <footer>
        <p>ONG Solidariedade</p>
    </footer>
</body>

</html>
